[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.package]
description = "Traits providing a simple framework for decision-making via voter consensus"
version = "0.0.3"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/kylekingcdn/arbitrait-rs"
license = "MIT"
publish = false
exclude = [
    "CHANGELOG.md"
]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
serde = "1.0.229"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
duplicated_attributes = "warn"
